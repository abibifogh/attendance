<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <title>Set up your account</title>
  <!-- Nothing behind this link should ever be indexed or previewed. -->
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="referrer" content="no-referrer" />
  <link rel="stylesheet" href="/styles.css" />
  <!-- So the browser can offer to install once the account is set up. Without a
       manifest on the page there is no offer to catch, and the steps below it
       would be all anybody ever got. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>" />
  <link rel="apple-touch-icon" href="/icons/hive-192.png" />
</head>
<body class="invite-body">
  <main id="join" class="invite">
    <div class="boot"><p>Loading…</p></div>
  </main>
  <div id="toasts" class="toasts" popover="manual" aria-live="polite"></div>
  <script type="module" src="/js/join.js"></script>
</body>
</html>

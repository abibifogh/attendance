name = "niceoperation-attendance"
main = "src/index.js"
compatibility_date = "2025-05-05"

# The app and its API are one Worker; everything that is not /api/* is served
# from public/ as a static asset.
[assets]
directory = "public"
binding = "ASSETS"

# Keep the Worker's own logs. Without this an error that happens once, at
# half past eleven at night, on somebody else's laptop, leaves nothing behind
# to look at — and the only account of it is a screenshot of a status code.
[observability]
enabled = true
head_sampling_rate = 1

# The live channel. One object for the property: every signed-in browser holds
# a socket to it, and anything that changes on the server is said down all of
# them at once. Sockets are hibernated rather than held in memory, so two dozen
# phones connected overnight cost nothing while nothing is happening.
[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveHub"

# SQLite-backed, which is what makes a Durable Object available without a paid
# plan. Nothing is stored in it — the sockets are the whole state — but the
# storage backend still has to be declared.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveHub"]

[[d1_databases]]
binding = "DB"
database_name = "attendance"
# Filled in by `npm run db:create` — see the README.
database_id = "1df34f21-bfc6-43dc-b11a-1a57d7f691b0"

[vars]
# Nothing secret lives here. SESSION_SECRET, MANAGER_PIN and RESEND_API_KEY are
# Worker secrets, set with `wrangler secret put`.
#
# Two more switch on arriving here already signed in from the group hub. Both
# optional: without them /sso says it is not connected, and PIN and password
# sign-in are unaffected. See bi/docs/sso.md.
#
#   INSIGHT_SSO_URL      https://<insight>/api/sso/redeem
#   INSIGHT_SSO_SECRET   the same value as SSO_SECRET_ATTENDANCE on Insight

# Two schedules.
#
# The first is once a day, a little after midnight in Accra: it recomputes the
# last few days so a punch that arrived late is reflected, and rings the bell
# once for whatever still needs a person.
#
# The second watches the shifts people are inside right now, and says one of
# two things to one person. That a published shift started, its own grace
# allowed for, with nothing recorded against it. Or that the shift ends in ten
# minutes and the tap on the way out has not happened yet.
#
# Every five minutes rather than every fifteen, because "ten minutes before it
# ends" has to be able to land: on a quarter-hourly run a shift ending at two
# o'clock would be told at a quarter to, and one ending at ten past would be
# told at two. Five minutes is what makes the number in the message true.
[triggers]
crons = ["30 0 * * *", "*/5 * * * *"]

[[routes]]
pattern = "staff.niceoperation.com"
custom_domain = true

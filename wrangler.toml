name = "niceoperation-attendance"
main = "src/index.js"
compatibility_date = "2025-05-05"

# The app and its API are one Worker; everything that is not /api/* is served
# from public/ as a static asset.
[assets]
directory = "public"
binding = "ASSETS"

# Keep the Worker's own logs. Without this an error that happens once, at
# half past eleven at night, on somebody else's laptop, leaves nothing behind
# to look at — and the only account of it is a screenshot of a status code.
[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "attendance"
# Filled in by `npm run db:create` — see the README.
database_id = "1df34f21-bfc6-43dc-b11a-1a57d7f691b0"

[vars]
# Nothing secret lives here. SESSION_SECRET, MANAGER_PIN and RESEND_API_KEY are
# Worker secrets, set with `wrangler secret put`.
#
# Two more switch on arriving here already signed in from the group hub. Both
# optional: without them /sso says it is not connected, and PIN and password
# sign-in are unaffected. See bi/docs/sso.md.
#
#   INSIGHT_SSO_URL      https://<insight>/api/sso/redeem
#   INSIGHT_SSO_SECRET   the same value as SSO_SECRET_ATTENDANCE on Insight

# Once a day, a little after midnight in Accra. Recomputes the last few days so
# a punch that arrived late is reflected, and rings the bell once for whatever
# still needs a person.
[triggers]
crons = ["30 0 * * *"]

[[routes]]
pattern = "staff.niceoperation.com"
custom_domain = true

name: Set Insight's secrets

# The reporting layer's secrets, from a button, without a terminal.
#
# Values come from *repository* secrets, never from a form on this page —
# anything typed into a workflow input stays readable in the run afterwards,
# which is exactly the wrong place for a password.
#
#   Settings → Secrets and variables → Actions → New repository secret
#
#     INSIGHT_DASHBOARD_PASSWORD   required — what you type the first time
#     INSIGHT_POS_REPORTS_KEY      optional — the POS's own REPORTS_API_KEY
#     INSIGHT_LAUNDRY_TOKEN        optional — a laundry staff token
#     INSIGHT_SSO_SECRET_BREAKFAST optional — must match the breakfast app
#     INSIGHT_SSO_SECRET_POS       optional — must match the POS
#     INSIGHT_SSO_SECRET_LAUNDRY   optional — must match the laundry
#     INSIGHT_SUPABASE_KEYS        optional — NAME=key lines, one per database
#
# Two things this generates rather than asking for, because both ends of each
# are inside this repository and nobody ever needs to read them:
#
#   SESSION_SECRET          signs session cookies here
#   SSO_SECRET_ATTENDANCE   shared with the attendance Worker, set on both
#
# Generating them means they exist only on the Workers — not in GitHub, not in
# a log, not in anybody's password manager. Re-running makes new ones, which
# signs everybody out and is otherwise harmless.
#
# Then: Actions → Set Insight's secrets → Run workflow.
# Running this does not deploy anything or touch any data.

on:
  workflow_dispatch:
    inputs:
      insight_url:
        description: "Insight's own address — copy it from the Set up Insight run's Publish step. Leave blank to skip joining attendance up."
        required: false
        default: ''
      rotate:
        description: 'Make new signing and hand-off keys (signs everybody out)'
        type: boolean
        required: false
        default: false

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: Check the credentials are here
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PASSWORD: ${{ secrets.INSIGHT_DASHBOARD_PASSWORD }}
        run: |
          set -eu
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set" \
              "under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "$PASSWORD" ]; then
            echo "::error::INSIGHT_DASHBOARD_PASSWORD is not set. Without it nobody can" \
              "sign in at all — add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check Insight has been set up
        run: |
          set -eu
          # Same question as the deploy gate: is the warehouse binding live and
          # real? Not "does the word REPLACE appear anywhere in the file" —
          # setup comments out unused bindings and leaves their placeholder in
          # the comment.
          if ! node -e "
            import('./bi/scripts/wrangler-config.mjs').then(({ bindingId, bindingEnabled }) => {
              const config = require('node:fs').readFileSync('bi/wrangler.toml', 'utf8');
              const id = bindingId(config, 'DB');
              process.exit(bindingEnabled(config, 'DB') && id && !/REPLACE/.test(id) ? 0 : 1);
            }).catch(() => process.exit(1));
          "; then
            echo "::error::Insight's warehouse database is not wired up yet." \
              "Run the 'Set up Insight' workflow first."
            exit 1
          fi

      # A secret cannot be put on a Worker that does not exist, and wrangler's
      # own error for that is not obvious. Ask the question directly, once.
      - name: Check Insight has been deployed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          if ! npx wrangler secret list --config bi/wrangler.toml >/dev/null 2>&1; then
            echo "::error::Insight has not been published yet, so there is no Worker to put a" \
              "secret on. Let the 'Test & Deploy' run started by the setup commit finish," \
              "then run this again."
            exit 1
          fi

      # Each value is piped in rather than passed as an argument, so it never
      # appears in a process list. A blank one is skipped rather than written as
      # an empty secret, which would be worse than not setting it.
      - name: Put them on the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DASHBOARD_PASSWORD: ${{ secrets.INSIGHT_DASHBOARD_PASSWORD }}
          POS_REPORTS_KEY: ${{ secrets.INSIGHT_POS_REPORTS_KEY }}
          LAUNDRY_TOKEN: ${{ secrets.INSIGHT_LAUNDRY_TOKEN }}
          SSO_SECRET_BREAKFAST: ${{ secrets.INSIGHT_SSO_SECRET_BREAKFAST }}
          SSO_SECRET_POS: ${{ secrets.INSIGHT_SSO_SECRET_POS }}
          SSO_SECRET_LAUNDRY: ${{ secrets.INSIGHT_SSO_SECRET_LAUNDRY }}
          SUPABASE_KEYS: ${{ secrets.INSIGHT_SUPABASE_KEYS }}
          ROTATE: ${{ inputs.rotate }}
        run: |
          set -eu

          put () {
            name="$1"; value="$2"; config="$3"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --config "$config"
              echo "- set \`$name\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- skipped \`$name\` (no repository secret of that name)" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          # Is a secret already on the Worker? Rotating one that exists signs
          # people out, so it is only done on request or when there is none.
          have () {
            npx wrangler secret list --config "$2" 2>/dev/null | grep -q "\"$1\"" && return 0 || return 1
          }

          echo "### Insight" >> "$GITHUB_STEP_SUMMARY"

          # The signing key. Generated here, kept nowhere else. Losing it costs
          # everybody their session and nothing more.
          if [ "$ROTATE" = "true" ] || ! have SESSION_SECRET bi/wrangler.toml; then
            openssl rand -base64 32 | tr -d '\n' | npx wrangler secret put SESSION_SECRET --config bi/wrangler.toml
            echo "- generated \`SESSION_SECRET\` (exists only on the Worker)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- left \`SESSION_SECRET\` alone (already set)" >> "$GITHUB_STEP_SUMMARY"
          fi

          put DASHBOARD_PASSWORD   "${DASHBOARD_PASSWORD:-}"   bi/wrangler.toml
          put POS_REPORTS_KEY      "${POS_REPORTS_KEY:-}"      bi/wrangler.toml
          put LAUNDRY_TOKEN        "${LAUNDRY_TOKEN:-}"        bi/wrangler.toml
          put SSO_SECRET_BREAKFAST "${SSO_SECRET_BREAKFAST:-}" bi/wrangler.toml
          put SSO_SECRET_POS       "${SSO_SECRET_POS:-}"       bi/wrangler.toml
          put SSO_SECRET_LAUNDRY   "${SSO_SECRET_LAUNDRY:-}"   bi/wrangler.toml

          # Any Supabase databases, as NAME=key lines. The name is whatever the
          # source was called when it was added, so the secret's name matches
          # what the Setup screen tells you to set.
          if [ -n "${SUPABASE_KEYS:-}" ]; then
            printf '%s\n' "$SUPABASE_KEYS" | while IFS= read -r line; do
              [ -z "$line" ] && continue
              name="SUPABASE_KEY_$(printf '%s' "${line%%=*}" | tr '[:lower:]-' '[:upper:]_')"
              value="${line#*=}"
              put "$name" "$value" bi/wrangler.toml
            done
          fi

      # The one hand-off where both ends are in this repository, so the shared
      # secret can be made and installed on both without a person seeing it.
      - name: Join attendance up
        if: ${{ inputs.insight_url != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INSIGHT_URL: ${{ inputs.insight_url }}
          ROTATE: ${{ inputs.rotate }}
        run: |
          set -eu
          echo "### Attendance hand-off" >> "$GITHUB_STEP_SUMMARY"

          case "$INSIGHT_URL" in
            https://*) ;;
            *) echo "::error::Insight's address must start with https://"; exit 1 ;;
          esac

          have_att () {
            npx wrangler secret list --config wrangler.toml 2>/dev/null | grep -q '"INSIGHT_SSO_SECRET"'
          }

          if [ "$ROTATE" = "true" ] || ! have_att; then
            SHARED="$(openssl rand -base64 32 | tr -d '\n')"
            printf '%s' "$SHARED" | npx wrangler secret put SSO_SECRET_ATTENDANCE --config bi/wrangler.toml
            printf '%s' "$SHARED" | npx wrangler secret put INSIGHT_SSO_SECRET     --config wrangler.toml
            unset SHARED
            echo "- generated a shared secret and set it on both Workers" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- left the shared secret alone (already set — tick *rotate* to replace it)" >> "$GITHUB_STEP_SUMMARY"
          fi

          printf '%s' "${INSIGHT_URL%/}/api/sso/redeem" | npx wrangler secret put INSIGHT_SSO_URL --config wrangler.toml
          echo "- attendance will redeem at \`${INSIGHT_URL%/}/api/sso/redeem\`" >> "$GITHUB_STEP_SUMMARY"
          {
            echo ""
            echo "Finish it in Insight under **Accounts → Where each system lives**: set"
            echo "attendance's sign-in address to \`https://staff.niceoperation.com/sso\` and"
            echo "tick the hand-off."
          } >> "$GITHUB_STEP_SUMMARY"

      # Names only. The values are never readable again, by anybody, including
      # this workflow.
      - name: What the Workers hold now
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "### Insight holds" >> "$GITHUB_STEP_SUMMARY"
          npx wrangler secret list --config bi/wrangler.toml || true
          echo "### Attendance holds" >> "$GITHUB_STEP_SUMMARY"
          npx wrangler secret list --config wrangler.toml || true

name: Set the app's secrets

# Cloudflare's dashboard moves "Variables and Secrets" around between versions,
# and hunting for it is a poor way to spend an afternoon. This does the same job
# from a button, and never puts a secret anywhere it could be read afterwards.
#
# The values are taken from *repository* secrets rather than typed into the form
# below. Anything typed into a workflow input is visible in the run afterwards,
# which is exactly the wrong place for a session key.
#
#   Settings → Secrets and variables → Actions → New repository secret
#
#     APP_SESSION_SECRET   forty or more random characters
#     APP_MANAGER_PIN      six digits, the emergency way in
#     APP_RESEND_API_KEY   only if you want the morning email digest
#
# Then: Actions → Set the app's secrets → Run workflow.
#
# Safe to run again whenever you change one of them. Running it does not deploy
# anything or touch the database.

on:
  workflow_dispatch:

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: Check the credentials are here
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set" \
              "under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Each value is piped in rather than passed as an argument, so it never
      # appears in a process list. A blank one is skipped rather than being
      # written as an empty secret, which would be worse than not setting it.
      - name: Put them on the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SECRET: ${{ secrets.APP_SESSION_SECRET }}
          MANAGER_PIN: ${{ secrets.APP_MANAGER_PIN }}
          RESEND_API_KEY: ${{ secrets.APP_RESEND_API_KEY }}
        run: |
          set -eu
          any=0
          put () {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
              echo "- set $name" >> "$GITHUB_STEP_SUMMARY"
              any=1
            else
              echo "- skipped $name (no repository secret of that name)" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          echo "### Secrets" >> "$GITHUB_STEP_SUMMARY"
          put SESSION_SECRET "${SESSION_SECRET:-}"
          put MANAGER_PIN "${MANAGER_PIN:-}"
          put RESEND_API_KEY "${RESEND_API_KEY:-}"

          if [ "$any" = "0" ]; then
            echo "::error::Nothing was set. Add APP_SESSION_SECRET and APP_MANAGER_PIN" \
              "under Settings → Secrets and variables → Actions, then run this again."
            exit 1
          fi

      # Names only — the values are never readable again, by anybody, including
      # this workflow.
      - name: What the Worker holds now
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler secret list

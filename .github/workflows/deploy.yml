name: Test & Deploy

# Everything happens here rather than on anybody's laptop. A change committed
# through GitHub's own web editor runs the tests, applies any new database
# changes, and publishes — so setting this up and looking after it needs a
# browser and nothing else.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the tests
        run: npm test

  # The reporting layer in bi/ is a separate Worker with its own database, so
  # it has its own test job and no deploy step here — it is published by hand
  # once, after its D1 bindings are filled in. Its tests need nothing installed
  # at all: node:test and node:sqlite are both in Node itself.
  insight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the reporting layer's tests
        working-directory: bi
        run: node --test "test/**/*.test.js"

  deploy:
    # Only the default branch deploys; pull requests stop at the test job.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Deploying from here is optional. If the Worker is connected to
      # Cloudflare directly (Workers → Builds), Cloudflare does the deploy on
      # its own and these credentials will not be set. Skip quietly rather than
      # failing, so a perfectly healthy setup does not report a red build on
      # every save.
      - name: Check for Cloudflare credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped"
              echo ""
              echo "No Cloudflare credentials are set in this repository, so nothing was published."
              echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under"
              echo "Settings → Secrets and variables → Actions."
              echo ""
              echo "This is expected — and correct — if Cloudflare publishes the site itself"
              echo "via Workers Builds. The tests above still ran."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.creds.outputs.ready == 'true'

      # Migrations run before the deploy so the new code never meets an old
      # schema. Every migration is written to be safe to re-apply, so a run
      # that changes nothing is a normal outcome rather than a failure.
      - name: Apply database changes
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply attendance --remote

      - name: Publish
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # What the database actually looks like afterwards, in the run summary. A
      # schema change nobody can see is a schema change nobody trusts.
      #
      # The site address is in there because every link the property sends out
      # is built on it, and a path left on the end of it breaks all of them at
      # once in a way that reads to the person holding the link as "this has
      # expired". It is the address of a public web page — nothing secret.
      #
      # Two things learned the hard way. The SQL stays on one line: a YAML
      # folded block keeps the newline before any line indented further than the
      # first, so a prettily-aligned query arrives at the shell in pieces and
      # wrangler is handed half a statement. And the step cannot fail the run —
      # it reports on a deploy that has already happened, and a cosmetic query
      # marking a successful publish as red teaches everybody to ignore red.
      - name: What is in the database now
        if: steps.creds.outputs.ready == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute attendance --remote --command "SELECT (SELECT COUNT(*) FROM users) AS logins, (SELECT COUNT(*) FROM att_staff) AS staff, (SELECT COUNT(*) FROM att_shifts) AS shifts, (SELECT COUNT(*) FROM att_devices) AS terminals, (SELECT COUNT(*) FROM att_punches) AS punches, (SELECT value FROM settings WHERE key = 'site_url') AS site_url"

  # Publishing the reporting layer, once it has been set up.
  #
  # Dormant until two things are true: Cloudflare credentials exist, and
  # bi/wrangler.toml no longer carries its placeholder database id. Until then
  # this skips quietly and says why, rather than turning the build red on every
  # save for a thing nobody has switched on yet.
  deploy-insight:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: insight
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-insight
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Is it set up yet?
        id: ready
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### Insight not published — no Cloudflare credentials" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The gate is whether the *warehouse* binding is live and real. A
          # grep for the placeholder anywhere in the file is not the same
          # question: setup comments out any binding whose database does not
          # exist, and a commented-out placeholder would keep this dormant for
          # ever. Reuses the module the setup script is tested against.
          if node -e "
            import('./bi/scripts/wrangler-config.mjs').then(({ bindingId, bindingEnabled }) => {
              const config = require('node:fs').readFileSync('bi/wrangler.toml', 'utf8');
              const id = bindingId(config, 'DB');
              process.exit(bindingEnabled(config, 'DB') && id && !/REPLACE/.test(id) ? 0 : 1);
            }).catch(() => process.exit(1));
          "; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Insight not published yet"
              echo ""
              echo 'Its warehouse database has not been wired up. Run'
              echo '**Actions → Set up Insight**, and this publishes on the next push.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version: 22

      # Migrations before the deploy, so new code never meets an old schema.
      # Every migration is written to be safe to re-apply.
      - name: Apply the warehouse's database changes
        if: steps.ready.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bi
          command: d1 migrations apply insight --remote

      - name: Publish Insight
        if: steps.ready.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bi
          command: deploy

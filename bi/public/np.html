<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nice Place · end of shift</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    :root { --plane: #f9f9f7; --surface: #fcfcfb; --surface-2: #f2f1ed; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781; --line: rgba(11,11,11,.18); --blue: #2a78d6; --good: #0b6b35; --good-bg: #e5f3ea; --bad: #a12626; --bad-bg: #fbe6e6; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--plane); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    header { background: #16232e; color: #fff; padding: 16px; }
    header b { display: block; font-size: 18px; }
    header small { opacity: .8; }
    main { max-width: 520px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
    label, .lbl { font-size: 14px; color: var(--ink-2); font-weight: 600; display: grid; gap: 6px; }
    select, input { font: inherit; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); width: 100%; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .shot { border: 2px dashed var(--line); border-radius: 12px; min-height: 150px; display: grid; place-items: center; text-align: center; color: var(--ink-2); background: var(--surface-2); cursor: pointer; overflow: hidden; }
    .shot b { display: block; color: var(--ink); font-size: 17px; }
    .shot img { width: 100%; display: block; }
    .num input { font: 700 20px ui-monospace, Menlo, Consolas, monospace; }
    .num small { font-weight: 500; color: var(--muted); }
    button { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 14px; background: var(--blue); color: #fff; width: 100%; cursor: pointer; }
    button:disabled { opacity: .6; }
    .err { background: var(--bad-bg); color: var(--bad); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
    .done { text-align: center; display: grid; gap: 10px; padding: 24px 8px; }
    .ok { width: 64px; height: 64px; border-radius: 50%; background: var(--good-bg); color: var(--good); display: grid; place-items: center; font-size: 32px; margin: 0 auto; }
    .note { font-size: 14px; color: var(--ink-2); }
    .link { background: none; color: var(--blue); padding: 4px; width: auto; font-weight: 600; }
  </style>
</head>
<body>
  <header><b>Nice Place · end of shift</b><small id="when">Loading…</small></header>
  <main id="page"><p class="note">Loading…</p></main>
  <script type="module" src="/js/np.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Your float · receipts</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f5f8">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #f4f5f8; --surface: #fff; --surface-2: #f1f2f6; --ink: #14161a; --ink-2: #4b515c; --muted: #8a909b; --line: #e3e6eb;
      --accent: #4f46e5; --accent-2: #eef0ff; --good: #15803d; --good-bg: #e9f7ee; --bad: #b91c1c; --bad-bg: #fdecec; --warn: #8a5300; --warn-bg: #fdf3e3;
      --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 14px rgba(16,24,40,.06); }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .num { font-variant-numeric: tabular-nums; }
    main { max-width: 520px; margin: 0 auto; padding: 0 0 110px; }
    .top { padding: 18px 16px 0; display: flex; align-items: center; gap: 12px; }
    .avatar { width: 42px; height: 42px; border-radius: 99px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; flex: none; }
    .top small { display: block; color: var(--muted); font-size: 13px; }
    .top b { font-size: 18px; }
    .ref { margin-left: auto; font: 600 12px ui-monospace, Menlo, monospace; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; color: var(--ink-2); white-space: nowrap; }
    .hero { margin: 14px 16px 0; border-radius: 22px; padding: 18px; color: #fff; background: linear-gradient(135deg, #312e81, #4f46e5 60%, #6366f1); box-shadow: 0 10px 24px rgba(79,70,229,.3); }
    .hero small { opacity: .85; font-size: 13px; }
    .hero .big { font-size: 36px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; margin: 2px 0 12px; }
    .stack { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,.22); gap: 2px; }
    .stack i { display: block; height: 100%; }
    .trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
    .trio div { background: rgba(255,255,255,.12); border-radius: 12px; padding: 8px 10px; min-width: 0; }
    .trio small { display: block; font-size: 12px; }
    .trio b { font-size: 14px; white-space: nowrap; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 99px; margin-right: 5px; vertical-align: 1px; }
    .alert, .said { margin: 12px 16px 0; border-radius: 14px; padding: 10px 12px; font-size: 14px; }
    .alert { background: var(--bad-bg); color: var(--bad); }
    .alert b { display: block; }
    .said { background: var(--good-bg); color: var(--good); font-weight: 600; }
    .said.err { background: var(--bad-bg); color: var(--bad); }
    .seg { display: flex; background: #e9eaf0; border-radius: 12px; padding: 3px; gap: 2px; margin: 16px 16px 0; }
    .seg button { flex: 1; border: 0; background: none; padding: 7px 4px; border-radius: 9px; font-weight: 600; color: var(--ink-2); font-size: 14px; }
    .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    .list { margin: 12px 16px 0; display: grid; gap: 10px; }
    .day { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 6px 2px -2px; }
    .item { background: var(--surface); border-radius: 16px; padding: 12px; box-shadow: var(--shadow); display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: start; }
    .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; }
    .ico.in { background: #e7f7f3; } .ico.out { background: var(--accent-2); } .ico.no { background: var(--bad-bg); }
    .item b { display: block; font-size: 15px; overflow-wrap: anywhere; }
    .item small { display: block; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .amt { text-align: right; font-weight: 800; white-space: nowrap; }
    .amt.in { color: var(--good); }
    .amt.off { color: var(--muted); text-decoration: line-through; }
    .amt small { font-weight: 500; text-decoration: none; }
    .memo { grid-column: 2 / 4; background: var(--surface-2); border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; padding: 6px 10px; font-size: 14px; }
    .memo.why { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
    .memo.ask, .alert.ask { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
    .memo.ask { display: grid; gap: 6px; } .memo.ask b { color: var(--ink); }
    .askbtns { display: flex; gap: 8px; flex-wrap: wrap; } .askbtns .btn { padding: 8px 12px; font-size: 14px; }
    .askwhy { display: grid; gap: 8px; } .askwhy[hidden], .askbtns[hidden] { display: none; } .askwhy label { font-size: 14px; font-weight: 600; color: var(--ink); display: grid; gap: 4px; }
    .chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); margin-top: 4px; }
    .chip.ok { background: var(--good-bg); color: var(--good); } .chip.no { background: var(--bad-bg); color: var(--bad); } .chip.wait { background: var(--warn-bg); color: var(--warn); }
    .card { background: var(--surface); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); }
    .card h2 { margin: 0 0 4px; font-size: 16px; }
    .lead { color: var(--ink-2); font-size: 14px; margin: 0 0 10px; }
    .empty { color: var(--muted); text-align: center; padding: 18px 0; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .chips button { border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 6px 12px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
    .chips button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .dates { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-bottom: 12px; }
    .dates label { font-size: 13px; color: var(--ink-2); font-weight: 600; display: grid; gap: 4px; }
    input { font: inherit; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); width: 100%; min-width: 0; }
    .sumrows div { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
    .sumrows div:last-child { border: 0; font-weight: 800; }
    .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .btn { border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 11px 12px; font-weight: 700; text-align: center; text-decoration: none; color: var(--ink); display: block; }
    .btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
    .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); background: linear-gradient(rgba(244,245,248,0), var(--bg) 30%); }
    .dock button { display: block; width: 100%; max-width: 488px; margin: 0 auto; border: 0; border-radius: 16px; padding: 16px; background: var(--ink); color: #fff; font-size: 17px; font-weight: 800; box-shadow: 0 8px 20px rgba(0,0,0,.2); }
    .dock button:disabled { opacity: .7; }
    .sheet { position: fixed; inset: 0; z-index: 3; background: rgba(20,22,26,.45); display: flex; align-items: flex-end; justify-content: center; }
    .sheet .in { background: #fff; width: 100%; max-width: 520px; border-radius: 22px 22px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom)); display: grid; gap: 10px; }
    .sheet h2 { margin: 0; font-size: 18px; }
    .thumbs { display: flex; gap: 8px; overflow-x: auto; }
    .thumbs img, .thumbs span { width: 72px; height: 72px; border-radius: 10px; object-fit: cover; flex: none; background: var(--surface-2); display: grid; place-items: center; font-size: 13px; color: var(--ink-2); }
    .sheet label { font-size: 13px; color: var(--ink-2); font-weight: 600; display: grid; gap: 4px; }
    .places { display: grid; gap: 6px; }
    .places .lbl { font-size: 13px; color: var(--ink-2); font-weight: 600; }
    .places .opts { display: flex; flex-wrap: wrap; gap: 8px; }
    .places .opts button { flex: 1 1 30%; border: 2px solid #e3e6eb; background: #fff; border-radius: 12px; padding: 12px 8px; font: inherit; font-weight: 700; color: var(--ink); }
    .places .opts button.on { border-color: #4f46e5; background: #eef0ff; color: #3730a3; }
    .places .needs { display: none; color: var(--bad); font-weight: 600; }
    .places.need .needs { display: block; }
    .places.need .opts button { border-color: var(--bad); }
    .goes { margin: 0; background: #fff4e5; color: #9a3412; border-radius: 12px; padding: 10px 12px; font-weight: 600; font-size: 14px; }
    .err { background: var(--bad-bg); color: var(--bad); border-radius: 12px; padding: 10px 12px; margin: 16px; }
  </style>
</head>
<body>
  <main id="page"><p class="empty">Loading…</p></main>
  <div class="dock" id="dock" hidden><button type="button" id="send">📷 Send a receipt</button></div>
  <input id="pick" type="file" accept="image/*,application/pdf" multiple hidden>
  <div id="overlay"></div>
  <script type="module" src="/js/float.js"></script>
</body>
</html>
